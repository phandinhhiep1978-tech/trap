name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon
      - name: Dump API 2 (only on failure)
        if: failure()
        run: |
          set +e
          MC=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name 'minecraft-merged*.jar' | head -1)
          FA=$(find ~/.gradle/caches/modules-2 -name 'fabric-rendering-v1-*.jar' ! -name '*sources*' | head -1)
          CP="$MC:$FA"
          for c in net.minecraft.client.render.RenderLayers net.minecraft.client.render.RenderLayer net.minecraft.client.render.VertexConsumer net.minecraft.client.render.VertexConsumerProvider; do
            echo "--- $c"
            javap -cp "$CP" -public "$c" | grep -v -E 'static final (int|float|double|long|java.lang.String) '
          done
          echo "--- GameRenderer camera"
          javap -cp "$CP" -public net.minecraft.client.render.GameRenderer | grep -i camera
          for c in 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext' 'net.fabricmc.fabric.api.client.rendering.v1.world.AbstractWorldRenderContext' 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents' 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents$EndMain' 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents$AfterEntities' 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents$BeforeTranslucent'; do
            echo "--- $c"
            javap -cp "$CP" -public "$c"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: trapbuilder-assistant
          path: build/libs/*.jar
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
